name: Editorial automation

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "30 20 * * 0"
  workflow_dispatch:
    inputs:
      task:
        description: "실행할 편집 작업"
        required: true
        default: "actual-bachata-video-samples"
        type: choice
        options:
          - actual-bachata-video-samples
          - collect-content
          - weekly-site-review

concurrency:
  group: editorial-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect-content:
    if: github.event.schedule == '17 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.task != 'weekly-site-review')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Collect public editorial signals
        if: github.event_name != 'workflow_dispatch' || inputs.task == 'collect-content'
        env:
          ADMIN_AUTOMATION_TOKEN: ${{ secrets.ADMIN_AUTOMATION_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          FORCE_AUTOMATION: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node scripts/collect-editorial-signals.mjs
      - name: Create actual bachata video samples
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'actual-bachata-video-samples'
        env:
          ADMIN_AUTOMATION_TOKEN: ${{ secrets.ADMIN_AUTOMATION_TOKEN }}
        run: node scripts/create-actual-bachata-video-samples.mjs

  weekly-site-review:
    if: github.event.schedule == '30 20 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.task == 'weekly-site-review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request weekly AI review
        env:
          ADMIN_AUTOMATION_TOKEN: ${{ secrets.ADMIN_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          curl --fail-with-body --max-time 90 \
            -X POST "https://bachata.co.kr/api/admin/automation" \
            -H "Authorization: Bearer ${ADMIN_AUTOMATION_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"mode":"weekly"}'