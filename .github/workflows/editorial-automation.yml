name: Editorial automation

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "30 20 * * 0"
  workflow_dispatch:

concurrency:
  group: editorial-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect-content:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Collect public editorial signals
        env:
          ADMIN_AUTOMATION_TOKEN: ${{ secrets.ADMIN_AUTOMATION_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          FORCE_AUTOMATION: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node scripts/collect-editorial-signals.mjs

  weekly-site-review:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 20 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request weekly AI review
        env:
          ADMIN_AUTOMATION_TOKEN: ${{ secrets.ADMIN_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          curl --fail-with-body --max-time 90 \
            -X POST "https://bachata.co.kr/api/admin/automation" \
            -H "Authorization: Bearer ${ADMIN_AUTOMATION_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"mode":"weekly"}'
